name: Site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate routes, data, and publication boundary
        run: python3 scripts/validate_site.py --root public

      - name: Test deterministic commercial-status validation
        run: python3 -m unittest -v tests.test_commercial_status

      - name: Authenticate the signed commercial-status bundle
        run: >-
          python3 scripts/commercial_status.py
          --bundle-root public/lightsout/current-release
          --javascript public/lightsout/lightsout.js

      - name: Test deterministic QQfenx performance validation
        run: python3 -m unittest -v tests.test_qqfenx_performance

      - name: Authenticate the signed QQfenx performance bundle
        run: >-
          python3 scripts/qqfenx_performance.py
          --bundle-root public/lightsout/qqfenx-performance-v0.1.4

      - name: Parse every JavaScript asset
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Install pinned browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .site-test-venv
          .site-test-venv/bin/python -m pip install --disable-pip-version-check --no-input playwright==1.62.0
          .site-test-venv/bin/python -m playwright install --with-deps chromium

      - name: Exercise the production payload in Chromium
        run: .site-test-venv/bin/python tests/browser_smoke.py --root public

  deploy:
    name: Deploy mfenx.com
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package the production payload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy the immutable artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-production:
    name: Verify production bytes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every live route with the deployed payload
        run: >-
          python3 scripts/verify_live.py
          --root public
          --origin https://mfenx.com
          --attempts 12
          --interval 10
